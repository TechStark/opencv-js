name: Build OpenCV.js

on:
  # push:
  #   branches:
  #     - build-opencv
  #     - main
  workflow_dispatch:
    inputs:
      opencv_version:
        description: "OpenCV version/branch to build"
        required: false
        default: "4.13.0"
        type: string
      emscripten_version:
        description: "Emscripten version to use"
        required: false
        default: "2.0.10"
        type: string
      build_flags:
        description: "Additional build flags (leave empty for defaults)"
        required: false
        default: ""
        type: string
      enable_contrib:
        description: "Enable opencv_contrib modules (includes text module with SWT)"
        required: false
        default: false
        type: boolean

jobs:
  build-opencv:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 cmake libv4l-dev

      - name: Checkout emsdk
        uses: actions/checkout@v5
        with:
          repository: emscripten-core/emsdk
          path: emsdk

      - name: Install and activate Emscripten
        run: |
          cd emsdk
          ./emsdk install ${{ github.event.inputs.emscripten_version || '2.0.10' }}
          ./emsdk activate ${{ github.event.inputs.emscripten_version || '2.0.10' }}

      - name: Checkout OpenCV
        uses: actions/checkout@v5
        with:
          repository: opencv/opencv
          ref: ${{ github.event.inputs.opencv_version || '4.13.0' }}
          path: opencv

      - name: Checkout opencv_contrib (if enabled)
        if: ${{ github.event.inputs.enable_contrib == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: opencv/opencv_contrib
          ref: ${{ github.event.inputs.opencv_version || '4.13.0' }}
          path: opencv_contrib

      - name: Checkout this repository for config files
        if: ${{ github.event.inputs.enable_contrib == 'true' }}
        uses: actions/checkout@v5
        with:
          path: opencv-js-repo

      - name: Build opencv.js
        run: |
          source emsdk/emsdk_env.sh
          BUILD_FLAGS="${{ github.event.inputs.build_flags }}"
          ENABLE_CONTRIB="${{ github.event.inputs.enable_contrib }}"
          
          # Build command base
          BUILD_CMD="emcmake python3 opencv/platforms/js/build_js.py build_js"
          
          # Add extra modules path if contrib is enabled
          if [ "$ENABLE_CONTRIB" = "true" ]; then
            BUILD_CMD="$BUILD_CMD --extra_modules=$(pwd)/opencv_contrib/modules"
            # Copy text module config to opencv platforms/js directory
            cp opencv-js-repo/opencv_js_text.config.py opencv/platforms/js/
            BUILD_CMD="$BUILD_CMD --config=opencv/platforms/js/opencv_js_text.config.py"
            # Enable text module build
            BUILD_CMD="$BUILD_CMD --cmake_option=-DBUILD_opencv_text=ON"
          fi
          
          # Add custom build flags if provided
          if [ -n "$BUILD_FLAGS" ]; then
            BUILD_CMD="$BUILD_CMD --build_flags=\"$BUILD_FLAGS\""
          fi
          
          echo "Executing: $BUILD_CMD"
          eval $BUILD_CMD

      - name: Verify build output
        run: |
          ls -lh build_js/bin/
          if [ -f "build_js/bin/opencv.js" ]; then
            echo "✓ opencv.js build successful"
            echo "File size: $(du -h build_js/bin/opencv.js | cut -f1)"
          else
            echo "✗ opencv.js build failed"
            exit 1
          fi

      - name: Prepare release info
        id: release_info
        run: |
          OPENCV_VER="${{ github.event.inputs.opencv_version || '4.13.0' }}"
          EMSDK_VER="${{ github.event.inputs.emscripten_version || '2.0.10' }}"
          BUILD_FLAGS="${{ github.event.inputs.build_flags }}"
          ENABLE_CONTRIB="${{ github.event.inputs.enable_contrib }}"

          # Use build number for uniqueness
          if [ "$ENABLE_CONTRIB" = "true" ]; then
            TAG_NAME="opencv-js-${OPENCV_VER}-contrib-build${{ github.run_number }}"
            RELEASE_NAME="OpenCV.js ${OPENCV_VER} with contrib (Build #${{ github.run_number }})"
          else
            TAG_NAME="opencv-js-${OPENCV_VER}-build${{ github.run_number }}"
            RELEASE_NAME="OpenCV.js ${OPENCV_VER} (Build #${{ github.run_number }})"
          fi

          # Prepare release description with all build parameters
          if [ -z "$BUILD_FLAGS" ]; then
            BUILD_FLAGS_DESC="Default (-s WASM=1 -s SINGLE_FILE=1 -s USE_PTHREADS=0)"
          else
            BUILD_FLAGS_DESC="$BUILD_FLAGS"
          fi

          cat << EOF > release_notes.md
          ## Build Configuration

          - **OpenCV Version**: \`${OPENCV_VER}\`
          - **Emscripten Version**: \`${EMSDK_VER}\`
          - **Build Flags**: \`${BUILD_FLAGS_DESC}\`
          - **Contrib Modules**: \`${ENABLE_CONTRIB}\`
          - **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Build Number**: #${{ github.run_number }}

          ## File Information

          - **File Size**: $(du -h build_js/bin/opencv.js | cut -f1)
          - **SHA256**: \`$(sha256sum build_js/bin/opencv.js | cut -d' ' -f1)\`

          EOF
          
          if [ "$ENABLE_CONTRIB" = "true" ]; then
            cat << EOF >> release_notes.md
          ## Included Modules

          This build includes opencv_contrib modules, specifically:
          - **text module**: Includes SWT (Stroke Width Transform) text detection and other text processing functions

          EOF
          fi
          
          cat << EOF >> release_notes.md
          For more information, see [OpenCV.js Tutorials](https://docs.opencv.org/4.x/d5/d10/tutorial_js_root.html).
          EOF

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release_notes.md
          files: build_js/bin/opencv.js
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
