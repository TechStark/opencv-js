name: Build OpenCV.js

on:
  # push:
  #   branches:
  #     - build-opencv
  #     - main
  workflow_dispatch:
    inputs:
      opencv_version:
        description: "OpenCV version/branch to build"
        required: false
        default: "5.0.0"
        type: string
      emscripten_version:
        description: "Emscripten version to use"
        required: false
        default: "4.0.20"
        type: string
      threads:
        description: "Build with pthreads support (-s USE_PTHREADS=1 + CMake)"
        required: false
        default: false
        type: boolean
      simd:
        description: "Build with WASM SIMD (-msimd128)"
        required: false
        default: false
        type: boolean
      enable_exception:
        description: "Enable C++ exception handling (-s DISABLE_EXCEPTION_CATCHING=0)"
        required: false
        default: false
        type: boolean
      disable_single_file:
        description: "Output separate .wasm + .js files instead of single bundle"
        required: false
        default: false
        type: boolean
      cmake_options:
        description: "Additional CMake options, space or newline separated (e.g. -DBUILD_opencv_dnn=OFF)"
        required: false
        default: ""
        type: string
      build_flags:
        description: "Additional raw Emscripten build flags (appended last)"
        required: false
        default: ""
        type: string

jobs:
  build-opencv:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 cmake libv4l-dev

      - name: Checkout emsdk
        uses: actions/checkout@v5
        with:
          repository: emscripten-core/emsdk
          path: emsdk

      - name: Cache Emscripten toolchain
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: |
            emsdk/upstream
            emsdk/node
            emsdk/.emscripten
          key: emsdk-${{ inputs.emscripten_version || '4.0.20' }}

      - name: Install and activate Emscripten
        run: |
          cd emsdk
          ./emsdk install ${{ inputs.emscripten_version || '4.0.20' }}
          ./emsdk activate ${{ inputs.emscripten_version || '4.0.20' }}

      - name: Checkout OpenCV
        uses: actions/checkout@v5
        with:
          repository: opencv/opencv
          ref: ${{ inputs.opencv_version || '5.0.0' }}
          path: opencv

      - name: Cache CMake build artifacts
        uses: actions/cache@v4
        with:
          path: build_js
          key: build-${{ inputs.opencv_version || '5.0.0' }}-emsdk${{ inputs.emscripten_version || '4.0.20' }}-threads${{ inputs.threads }}-simd${{ inputs.simd }}-exc${{ inputs.enable_exception }}-single${{ inputs.disable_single_file }}-cmake${{ inputs.cmake_options }}-flags${{ inputs.build_flags }}

      - name: Build opencv.js
        run: |
          source emsdk/emsdk_env.sh
          BUILD_CMD=(emcmake python3 opencv/platforms/js/build_js.py build_js)

          # Named feature flags — each maps to its own build_js.py option
          # so both CMake config and Emscripten linker flags are set correctly
          [[ "${{ inputs.threads }}" == "true" ]] && BUILD_CMD+=(--threads)
          [[ "${{ inputs.simd }}" == "true" ]] && BUILD_CMD+=(--simd)
          [[ "${{ inputs.enable_exception }}" == "true" ]] && BUILD_CMD+=(--enable_exception)
          [[ "${{ inputs.disable_single_file }}" == "true" ]] && BUILD_CMD+=(--disable_single_file)

          # Required for Emscripten 4.0.20+ (C++17 needed for Embind)
          BUILD_CMD+=(--cmake_option="-DCMAKE_CXX_STANDARD=17")

          # Additional cmake_options: space or newline separated
          CMAKE_OPTIONS="${{ inputs.cmake_options }}"
          while IFS= read -r opt; do
            opt="${opt// /}"  # trim spaces
            [[ -n "$opt" ]] && BUILD_CMD+=(--cmake_option="$opt")
          done <<< "$(echo "$CMAKE_OPTIONS" | tr ' ' '\n')"

          # Raw build flags appended last
          BUILD_FLAGS="${{ inputs.build_flags }}"
          [[ -n "$BUILD_FLAGS" ]] && BUILD_CMD+=(--build_flags="$BUILD_FLAGS")

          echo "Build command: ${BUILD_CMD[*]}"
          "${BUILD_CMD[@]}"

      - name: Verify build output
        run: |
          ls -lhR build_js/bin/
          if [ -f "build_js/bin/opencv.js" ]; then
            echo "✓ opencv.js build successful"
          else
            echo "✗ opencv.js build failed"
            exit 1
          fi

      - name: Prepare release info
        id: release_info
        run: |
          OPENCV_VER="${{ inputs.opencv_version || '5.0.0' }}"
          EMSDK_VER="${{ inputs.emscripten_version || '4.0.20' }}"
          CMAKE_OPTIONS="${{ inputs.cmake_options }}"
          BUILD_FLAGS="${{ inputs.build_flags }}"

          TAG_NAME="opencv-js-${OPENCV_VER}-build${{ github.run_number }}"
          RELEASE_NAME="OpenCV.js ${OPENCV_VER} (Build #${{ github.run_number }})"

          FEATURES=""
          [[ "${{ inputs.threads }}" == "true" ]] && FEATURES="${FEATURES} threads"
          [[ "${{ inputs.simd }}" == "true" ]] && FEATURES="${FEATURES} simd"
          [[ "${{ inputs.enable_exception }}" == "true" ]] && FEATURES="${FEATURES} exceptions"
          [[ "${{ inputs.disable_single_file }}" == "true" ]] && FEATURES="${FEATURES} split-files"
          FEATURES="${FEATURES# }"  # trim leading space
          FEATURES="${FEATURES:-none (defaults)}"

          ZIP_NAME="opencv-js-${OPENCV_VER}-build${{ github.run_number }}.zip"
          (cd build_js/bin && zip -r "../../${ZIP_NAME}" .)

          FILE_INFO="- \`${ZIP_NAME}\`: $(du -h "${ZIP_NAME}" | cut -f1) (SHA256: \`$(sha256sum "${ZIP_NAME}" | cut -d' ' -f1)\`)"

          cat << EOF > release_notes.md
          ## Build Configuration

          - **OpenCV Version**: \`${OPENCV_VER}\`
          - **Emscripten Version**: \`${EMSDK_VER}\`
          - **Features**: \`${FEATURES}\`
          - **CMake Options**: \`-DCMAKE_CXX_STANDARD=17${CMAKE_OPTIONS:+ $CMAKE_OPTIONS}\`
          - **Extra Build Flags**: \`${BUILD_FLAGS:-none}\`
          - **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ## File Information

          ${FILE_INFO}

          For more information, see [OpenCV.js Tutorials](https://docs.opencv.org/5.0.0/d5/d10/tutorial_js_root.html).
          EOF

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release_notes.md
          files: opencv-js-${{ inputs.opencv_version || '5.0.0' }}-build${{ github.run_number }}.zip
          draft: false
          prerelease: true
          make_latest: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
